services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kineplan
      POSTGRES_USER: kineplan
      POSTGRES_PASSWORD: kineplan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kineplan -d kineplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/kineplan
      DB_USERNAME: kineplan
      DB_PASSWORD: kineplan
      JWT_SECRET: change-this-development-secret-with-at-least-32-chars
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
